[project]
name = "cip-bootstrap"
version = "0.1.0"
description = "Composition root. Wires ports to concrete adapters by run mode."
requires-python = ">=3.12"
dependencies = [
    "cip-core",
    "cip-retrieval",
    "cip-agents",
]

[tool.uv.sources]
cip-core = { workspace = true }
cip-retrieval = { workspace = true }
cip-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]
