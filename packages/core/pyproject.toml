[project]
name = "cip-core"
version = "0.1.0"
description = "Domain model, ports and configuration. Depends on nothing."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]