[project]
name = "cip-retrieval"
version = "0.1.0"
description = "Embeddings, vector search, BM25, and the citation resolver."
requires-python = ">=3.12"
dependencies = [
    "cip-core",
]

[tool.uv.sources]
cip-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]