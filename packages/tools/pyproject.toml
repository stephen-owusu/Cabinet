[project]
name = "cip-tools"
version = "0.1.0"
description = "The functions an agent can call, exposed over MCP."
requires-python = ">=3.12"
dependencies = [
    "cip-core",
]

[tool.uv.sources]
cip-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]
