[project]
name = "cip-api"
version = "0.1.0"
description = "The HTTP surface that exposes the agent loop to the outside world."
requires-python = ">=3.12"
dependencies = [
    "cip-core",
]

[tool.uv.sources]
cip-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]
