[project]
name = "cip"
version = "0.1.0"
description = "Consultation Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "cip-core",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cip-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]
[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["packages/core/src"]

disallow_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true