name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-groups

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy packages

      - name: import-linter
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest
